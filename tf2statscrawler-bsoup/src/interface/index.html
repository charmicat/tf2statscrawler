<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
    <title>TF2 Stats Crawler</title>
    <link href="static/style.css" rel="stylesheet" type="text/css"/>
</head>

<body>
<table align="center" border="0" cellpadding="0" cellspacing="0"
       class="contentTable" width="820">
    <tr>
        <td><img align="left" src="static/header_top_l.gif" width="100%"></td>
        <td class="title" width="100%"></td>
        <td><img align="right" src="static/header_top_r.gif" width="100%"></td>
    </tr>
    <tr class="title">
        <td></td>
        <td>
            <div align="center">
                <p><img align="middle" src="static/logo.png"</p>
            </div>
        </td>
        <td></td>
    </tr>
    <tr class="shadow">
        <td>&nbsp;</td>
        <td>&nbsp;</td>
        <td>&nbsp;</td>
    </tr>
    <tr class="contentBody">
        <td></td>
        <td>
            <div align="center">
                <p>&nbsp;</p>
                <form action="" class="form" id="postStats" method="post"
                      name="postStats">
                    <table border="0" width="200">
                        <tr align="left">
                            <td><label>Group URL _ <br/>
                                <br/>
                                <input id="groupURL" name="groupURL" size="100" type="text"/> </label><br/>
                                <br/>
                            </td>
                        </tr>
                        <tr align="left">
                            <td><label> Stats _<br/>
                                <br/>
                                <input id="maxPoints" name="stat_maxPoints" type="checkbox"
                                       value="maxPoints"/> Max Points</label> <br/>
                                <label> <input id="maxKills" name="stat_maxKills"
                                               type="checkbox" value="maxKills"/> Max Kills</label> <br/>
                                <label> <input id="maxDamage" name="stat_maxDamage"
                                               type="checkbox" value="maxDamage"/> Max Damage</label> <br/>
                                <label> <input id="longestLife" name="stat_longestLife"
                                               type="checkbox" value="longestLife"/> Longest Life </label></td>
                        </tr>
                        <tr>
                            <td>&nbsp;</td>
                        </tr>
                        <tr align="left">
                            <td>
                                <p>Classes _</p>
                                <p><label> <input id="Medic" name="class_Medic"
                                                  type="checkbox" value="Medic"/> Medic</label> <br/>
                                    <label> <input id="Engineer" name="class_Engineer"
                                                   type="checkbox" value="Engineer"/> Engineer</label> <br/>
                                    <label> <input id="Pyro" name="class_Pyro"
                                                   type="checkbox" value="Pyro"/> Pyro</label> <br/>
                                    <label> <input id="Soldier" name="class_Soldier"
                                                   type="checkbox" value="Soldier"/> Soldier</label> <br/>
                                    <label> <input id="Demoman" name="class_Demoman"
                                                   type="checkbox" value="Demoman"/> Demoman</label> <br/>
                                    <label> <input id="Heavy" name="class_Heavy"
                                                   type="checkbox" value="Heavy"/> Heavy</label> <br/>
                                    <label> <input id="Spy" name="class_Spy" type="checkbox"
                                                   value="Spy"/> Spy</label> <br/>
                                    <label> <input id="Sniper" name="class_Sniper"
                                                   type="checkbox" value="Sniper"/> Sniper</label> <br/>
                                    <label> <input id="Scout" name="class_Scout"
                                                   type="checkbox" value="Scout"/> Scout</label> <br/>
                                </p>
                            </td>
                        </tr>
                        <tr align="center">
                            <td><label> <input id="sendChoices" name="sendChoices"
                                               type="submit" value="Submit"/> </label></td>
                        </tr>
                    </table>
                </form>
                <br/>
                <br/>
            </div>
        </td>
        <td></td>
    </tr>
    <tr>
        <td width="22px"><img src="static/header_bott_l.gif"></td>
        <td class="contentBody" width="100%"></td>
        <td width="22px"><img src="static/header_bott_r.gif"></td>
    </tr>
</table>
</body>
</html>
